<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title><link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/main.css">

<body><div class="container"><h1 style="text-align:center; margin-top:40px;">
    Личный кабинет
</h1>

<div class="register-form">

    <p><strong>Никнейм:</strong> <span id="nickname"></span></p>

    <p><strong>Имя:</strong> <span id="firstName"></span></p>

    <p><strong>Фамилия:</strong> <span id="lastName"></span></p>

    <p><strong>Отчество:</strong> <span id="middleName"></span></p>

    <p><strong>Email:</strong> <span id="email"></span></p>

    <p><strong>Телефон:</strong> <span id="phone"></span></p>

    <p><strong>Дата рождения:</strong> <span id="birthDate"></span></p>

    <button id="logoutBtn">
        Выйти из аккаунта
    </button>

</div>

</div><script src="js/profile.js"></script></body>
</html>
