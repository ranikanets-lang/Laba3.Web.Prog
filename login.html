<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.meta.title">Вход — PORTEN</title>
    <meta name="description" data-i18n="login.meta.description" content="Войдите в свой аккаунт PORTEN для управления заказами и избранного.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/adaptive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>

<!-- Прелоадер -->
<div class="preloader" data-preloader>
    <div class="preloader__spinner"></div>
    <div class="preloader__text" data-i18n="common.loading">Загрузка...</div>
</div>

<!-- Контейнер для уведомлений -->
<div id="notifications-container"></div>

<!-- Упрощённый хедер -->
<header class="header header--simple" data-header>
    <div class="container header__container">
        <a href="index.html" class="header__logo">
            <span class="header__logo-text">PORTEN</span>
        </a>
        <a href="index.html" class="btn btn--outline btn--sm" data-i18n="login.backToHome">На главную</a>
    </div>
</header>

<main id="main-content">
    <section class="login-section">
        <div class="login-container">
            <div class="login-card" data-animate>
                <div class="login-card__header">
                    <h1 class="login-card__title" data-i18n="login.title">Вход в аккаунт</h1>
                    <p class="login-card__subtitle" data-i18n="login.subtitle">Добро пожаловать обратно в мир элегантных аксессуаров</p>
                </div>

                <form id="loginForm" class="login-form" novalidate>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                <path d="M2 4a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V4zm2 0l6 4 6-4M4 6v10h12V6" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            <span data-i18n="login.email">Email</span> <span class="required">*</span>
                        </label>
                        <input type="email" id="email" class="form-input"
                               data-i18n-placeholder="login.emailPlaceholder"
                               placeholder="example@mail.com"
                               required
                               autocomplete="email"
                               aria-required="true">
                        <span class="form-error" id="emailError" role="alert"></span>
                    </div>

                    <!-- Пароль -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                <path d="M10 2a4 4 0 014 4v2h1a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2h1V6a4 4 0 014-4zm0 2a2 2 0 00-2 2v2h4V6a2 2 0 00-2-2z" fill="currentColor"/>
                            </svg>
                            <span data-i18n="login.password">Пароль</span> <span class="required">*</span>
                        </label>
                        <div class="input-wrapper">
                            <input type="password" id="password" class="form-input"
                                   data-i18n-placeholder="login.passwordPlaceholder"
                                   placeholder="••••••••"
                                   required
                                   autocomplete="current-password"
                                   aria-required="true">
                            <button type="button" class="toggle-password"
                                    data-target="password"
                                    aria-label="Показать пароль"
                                    data-i18n-aria="login.showPassword">👁</button>
                        </div>
                        <span class="form-error" id="passwordError" role="alert"></span>
                    </div>

                    <!-- Запомнить меня + Забыли пароль -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span data-i18n="login.remember">Запомнить меня</span>
                        </label>
                        <a href="#" class="forgot-password" data-i18n="login.forgotPassword">Забыли пароль?</a>
                    </div>

                    <!-- Кнопка входа -->
                    <button type="submit" id="loginBtn" class="btn--submit" data-i18n="login.submit">
                        Войти
                    </button>

                </form>

                <div class="login-footer">
                    <p data-i18n="login.noAccount">Нет аккаунта?</p>
                    <a href="register.html" class="btn btn--outline btn--full" data-i18n="login.register">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="footer" data-footer>
    <div class="container">
        <p data-i18n="footer.copyright">© 2025 PORTEN. Все права защищены.</p>
    </div>
</footer>

<!-- Модальное окно восстановления пароля -->
<div class="modal" data-modal="forgot-password-modal" hidden>
    <div class="modal__content modal__content--small">
        <div class="modal__header">
            <h3 data-i18n="login.forgotPasswordTitle">Восстановление пароля</h3>
            <button class="modal__close" data-modal-close aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal__body">
            <p data-i18n="login.forgotPasswordText">Введите ваш email, и мы отправим инструкцию по восстановлению пароля.</p>
            <form id="forgotPasswordForm" class="forgot-form">
                <div class="form-group">
                    <input type="email" class="form-input"
                           data-i18n-placeholder="login.emailPlaceholder"
                           placeholder="example@mail.com"
                           required>
                </div>
                <button type="submit" class="btn btn--primary btn--full" data-i18n="login.sendInstructions">
                    Отправить инструкцию
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Скрипты -->
<script type="module" src="js/main.js"></script>
<script src="js/login.js"></script>

</body>
</html>
