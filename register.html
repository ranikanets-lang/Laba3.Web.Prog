<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body><h1>Регистрация</h1><form id="registerForm"><input
    type="text"
    id="firstName"
    placeholder="Имя"
    required
<link rel="stylesheet" href="css/style.css">
>

<input
    type="text"
    id="lastName"
    placeholder="Фамилия"
    required
>

<input
    type="text"
    id="middleName"
    placeholder="Отчество"
>

<input
    type="email"
    id="email"
    placeholder="Email"
    required
>

<input
    type="tel"
    id="phone"
    placeholder="+375XXXXXXXXX"
    required
>

<input
    type="date"
    id="birthDate"
    required
>

<input
    type="password"
    id="password"
    placeholder="Пароль"
    required
>

<button type="submit">
    Зарегистрироваться
</button>

</form><script src="js/register.js"></script></body>
</html>
