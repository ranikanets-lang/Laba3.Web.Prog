<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/adaptive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/css/register.css">
</head>
<body><h1>Регистрация</h1><form id="registerForm" class="register-form">
    
<input
    type="text"
    id="firstName"
    placeholder="Имя"
    required
>

<input
    type="text"
    id="lastName"
    placeholder="Фамилия"
    required
>

<input
    type="text"
    id="middleName"
    placeholder="Отчество (необязательно)"
>

<input
    type="email"
    id="email"
    placeholder="Email"
    required
>

<input
    type="tel"
    id="phone"
    placeholder="+375XXXXXXXXX"
    pattern="^\+375(25|29|33|44)\d{7}$"
    required
>

<input
    type="date"
    id="birthDate"
    required
>

<div class="nickname-block">
    <input
        type="text"
        id="nickname"
        placeholder="Никнейм"
        readonly
    >

    <button
        type="button"
        id="generateNickname"
    >
        Сгенерировать ник
    </button>
</div>

<div class="password-mode">

    <label>
        <input
            type="radio"
            name="passwordType"
            value="manual"
            checked
        >
        Ввести пароль самостоятельно
    </label>

    <label>
        <input
            type="radio"
            name="passwordType"
            value="auto"
        >
        Сгенерировать пароль
    </label>

</div>

<input
    type="password"
    id="password"
    placeholder="Пароль"
    required
>

<button
    type="submit"
    class="btn btn--primary"
>
    Зарегистрироваться
</button>

</form>

    <script src="js/register.js"></script>
    
</body>
</html>
